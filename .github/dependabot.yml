version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/vendor-fabric
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/pytest-vendor-fabric
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
