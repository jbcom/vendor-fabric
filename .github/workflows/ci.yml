name: CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  fork-policy:
    name: Repository Policy / gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Reject untrusted control-plane changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            exit 0
          fi
          gh api --paginate "repos/$BASE_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
          if grep -Eq '^(\.github/(workflows|actions)/|\.github/dependabot\.yml$|\.coderabbit\.yaml$|sonar-project\.properties$|release-please-config\.json$|\.release-please-manifest\.json$|docs/sourcey\.config\.ts$|docs/package(-lock)?\.json$|pyproject\.toml$|uv\.lock$|tox\.ini$|\.pre-commit-config\.yaml$)' changed-files.txt; then
            echo "External forks cannot modify repository control-plane files." >&2
            exit 1
          fi

  route:
    name: CI route
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fast-path: ${{ steps.route.outputs.fast-path }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: dependabot
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo 'fast-path=true' >> "$GITHUB_OUTPUT"
            echo 'reason=release-please' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = pull_request ] && [ "$AUTHOR" = 'dependabot[bot]' ] && [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ] && { [ "$DEPENDABOT_UPDATE_TYPE" = version-update:semver-minor ] || [ "$DEPENDABOT_UPDATE_TYPE" = version-update:semver-patch ]; }; then
            echo 'fast-path=true' >> "$GITHUB_OUTPUT"
            echo 'reason=dependabot-non-major' >> "$GITHUB_OUTPUT"
          else
            echo 'fast-path=false' >> "$GITHUB_OUTPUT"
            echo 'reason=full-validation' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Python ${{ matrix.python-version }}
    needs: route
    if: github.event_name != 'pull_request_target' && needs.route.outputs.fast-path != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e "py$(echo '${{ matrix.python-version }}' | tr -d '.')"

  quality:
    name: Quality
    needs: route
    if: github.event_name != 'pull_request_target' && needs.route.outputs.fast-path != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run pre-commit run --all-files
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e lint,typecheck,plugin,providers,docs,build

  dependency-review:
    name: Dependency Review / gate
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.fast-path != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sonar:
    name: SonarQube Cloud
    needs: route
    if: >
      github.event_name != 'pull_request_target' &&
      needs.route.outputs.fast-path != 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - name: Verify SonarQube Cloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Create coverage report for SonarQube Cloud
        run: >-
          uv run pytest packages/vendor-fabric/tests packages/pytest-vendor-fabric/tests
          --cov=vendor_fabric --cov=pytest_vendor_fabric --cov-report=xml:coverage.xml
      - name: Analyze code and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  gate:
    name: gate
    if: always() && github.event_name != 'pull_request_target'
    needs: [route, test, quality, dependency-review, sonar]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm required validation completed
        run: |
          test "${{ needs.route.result }}" = success
          if [ "${{ needs.route.outputs.fast-path }}" = true ]; then
            exit 0
          fi
          test "${{ needs.test.result }}" = success
          test "${{ needs.quality.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.dependency-review.result }}" = success
          fi
          if [ "${{ github.event_name }}" != pull_request ] || { [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && [ "${{ github.event.pull_request.user.login }}" != 'dependabot[bot]' ]; }; then
            test "${{ needs.sonar.result }}" = success
          fi
