name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A release-please PR contains only generated release metadata. Filtering it
    # here prevents GitHub from creating a pull_request run that would require
    # approval for the github-actions bot before any job can publish `gate`.
    # `release-gate` below runs from the trusted base workflow and supplies the
    # required check without reading pull-request content.
    paths-ignore:
      - .release-please-manifest.json
      - packages/*/CHANGELOG.md
      - packages/*/pyproject.toml
      - packages/*/src/*/__init__.py
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  fork-policy:
    name: Repository Policy / gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Reject untrusted control-plane changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            exit 0
          fi
          gh api --paginate "repos/$BASE_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
          if grep -Eq '^(\.github/(workflows|actions)/|\.github/dependabot\.yml$|\.coderabbit\.yaml$|sonar-project\.properties$|release-please-config\.json$|\.release-please-manifest\.json$|docs/sourcey\.config\.ts$|docs/package(-lock)?\.json$|pyproject\.toml$|uv\.lock$|tox\.ini$|\.pre-commit-config\.yaml$)' changed-files.txt; then
            echo "External forks cannot modify repository control-plane files." >&2
            exit 1
          fi

  release-gate:
    name: gate
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Accept trusted generated release metadata
        run: true

  test:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e "py$(echo '${{ matrix.python-version }}' | tr -d '.')"

  quality:
    name: Quality
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run pre-commit run --all-files
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e lint,typecheck,plugin,providers,docs,build

  dependency-review:
    name: Dependency Review / gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sonar:
    name: SonarQube Cloud
    if: >
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - name: Verify SonarQube Cloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Create coverage report for SonarQube Cloud
        run: >-
          uv run pytest packages/vendor-fabric/tests packages/pytest-vendor-fabric/tests
          --cov=vendor_fabric --cov=pytest_vendor_fabric --cov-report=xml:coverage.xml
      - name: Analyze code and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  gate:
    name: gate
    if: always() && github.event_name != 'pull_request_target'
    needs: [test, quality, dependency-review, sonar]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm required validation completed
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.quality.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.dependency-review.result }}" = success
          fi
          if [ "${{ github.event_name }}" != pull_request ] || { [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && [ "${{ github.event.pull_request.user.login }}" != 'dependabot[bot]' ]; }; then
            test "${{ needs.sonar.result }}" = success
          fi
